# ───────────────────────────────────────────────
#  TableWise – Render Blueprint  (render.yaml)
#
#  Commit this file to the repo root.
#  Then: Render Dashboard → New → Blueprint → select this repo.
# ───────────────────────────────────────────────

databases:
  - name: tablewise-db
    plan: starter           # Free-tier managed Postgres
    databaseName: tablewise
    user: tablewise_user
    region: oregon          # Pick the region closest to your users
    postgresMajorVersion: "16"

services:
  - type: web
    name: tablewise-api
    runtime: docker
    region: oregon
    plan: starter           # Free-tier web service
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # ── Database ──────────────────────────────
      # Render auto-generates this from the database above.
      # The connectionString uses the internal network (fast, no egress cost).
      - key: DATABASE_URL
        fromDatabase:
          name: tablewise-db
          property: connectionString

      # ── App ───────────────────────────────────
      - key: ENVIRONMENT
        value: production

      - key: SECRET_KEY
        generateValue: true   # Render generates a random 64-char secret

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"

      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # ── Individual Postgres vars (used by Settings) ──
      - key: POSTGRES_USER
        fromDatabase:
          name: tablewise-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: tablewise-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: tablewise-db
          property: database
      - key: POSTGRES_HOST
        fromDatabase:
          name: tablewise-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: tablewise-db
          property: port

      # ── Redis (set to empty string if unused in prod MVP) ──
      - key: REDIS_URL
        value: ""

      # ── Third-party keys (set via Render Dashboard > Environment) ──
      - key: STRIPE_SECRET_KEY
        sync: false           # Prompt to enter manually on first deploy
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
